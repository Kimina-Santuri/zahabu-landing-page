<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Community Gallery — Zahabu Culture Garden</title>
    <meta name="description" content="Moments at Zahabu Culture Garden, shared by the people who were there.">

    <link rel="icon" href="images/favicon.ico">

    <style>

        /* Self-contained like code-of-conduct.html: duplicates index.html's font, tokens and background layers. */

        @font-face{
            font-family:"Futura";
            src:url("fonts/Futura-Regular.ttf") format("truetype");
            font-weight:normal;
            font-style:normal;
            font-display:swap;
        }

        :root{
            --ink:#141814;
            --ink-soft:#3d4640;
            --muted:#5f6a63;
            --glass:rgba(255,255,255,.55);
            --glass-border:rgba(255,255,255,.7);
            --line:rgba(20,24,20,.14);
            --forest:#2f5d3a;
            --radius:22px;
            --gutter:clamp(16px, 5vw, 56px);
            --ease:cubic-bezier(.22,.7,.2,1);
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html,
        body{
            width:100%;
            min-height:100%;
            overflow-x:hidden;
        }

        body{
            font-family:"Futura", sans-serif;
            font-size:16px;
            color:var(--ink);
            background:#e9f0ea;
            -webkit-font-smoothing:antialiased;
        }

        body.is-locked{
            overflow:hidden;
        }

        a{
            color:inherit;
            text-decoration:none;
        }

        button{
            font-family:inherit;
            color:inherit;
        }

        img{
            display:block;
        }

        [hidden]{
            display:none !important;
        }

        :focus-visible{
            outline:2px solid var(--ink);
            outline-offset:3px;
        }

        /* Icons are SVG because iOS swaps symbol characters for colour emoji. */
        .icon{
            display:inline-block;
            width:1em;
            height:1em;
            vertical-align:-.14em;
            fill:none;
            stroke:currentColor;
            stroke-width:1.6;
            stroke-linecap:round;
            stroke-linejoin:round;
            pointer-events:none;
        }

        /* ---------- BACKGROUND (same as index.html) ---------- */

        .bg-photo,
        .bg-overlay{
            position:fixed;
            inset:0;
        }

        .bg-photo{
            background:url("assets/garden-background.jpg") center/cover no-repeat;
            z-index:-2;
        }

        .bg-overlay{
            z-index:-1;
            background:linear-gradient(
                to bottom,
                rgba(255,255,255,.12) 0%,
                rgba(255,255,255,.34) 45%,
                rgba(255,255,255,.55) 100%
            );
        }

        /* ---------- HEADER ---------- */

        .top{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            padding:22px var(--gutter);
        }

        .top img{
            width:96px;
            height:auto;
        }

        .back{
            display:inline-flex;
            align-items:center;
            gap:8px;
            font-size:13px;
            letter-spacing:.16em;
            text-transform:uppercase;
            padding:6px 0;
            border-bottom:1px solid transparent;
            transition:border-color .2s ease;
        }

        .back:hover{
            border-bottom-color:currentColor;
        }

        /* ---------- INTRO ---------- */

        main{
            padding:clamp(24px, 5vw, 56px) var(--gutter) clamp(64px, 10vw, 120px);
        }

        .intro{
            max-width:760px;
            margin:0 auto;
            text-align:center;
        }

        .eyebrow{
            display:block;
            font-size:12px;
            letter-spacing:.26em;
            text-transform:uppercase;
            color:var(--muted);
            margin-bottom:22px;
        }

        h1{
            font-weight:normal;
            font-size:clamp(34px, 6vw, 60px);
            line-height:1.02;
            text-transform:uppercase;
        }

        .lead{
            max-width:560px;
            margin:22px auto 0;
            font-size:17px;
            line-height:1.7;
            color:var(--ink-soft);
        }

        .btn{
            display:inline-flex;
            align-items:center;
            gap:10px;
            margin-top:30px;
            padding:14px 26px;
            border-radius:999px;
            font-size:13px;
            letter-spacing:.14em;
            text-transform:uppercase;
            border:1px solid var(--ink);
            background:var(--ink);
            color:#fff;
            transition:background .25s ease, border-color .25s ease, transform .25s var(--ease);
        }

        .btn:hover{
            background:var(--forest);
            border-color:var(--forest);
            transform:translateY(-2px);
        }

        .count{
            margin-top:20px;
            font-size:12px;
            letter-spacing:.2em;
            text-transform:uppercase;
            color:var(--muted);
        }

        /* ---------- GALLERY ---------- */

        .gallery{
            max-width:1280px;
            margin:clamp(36px, 6vw, 64px) auto 0;
            columns:3 280px;
            column-gap:16px;
        }

        .tile{
            position:relative;
            display:block;
            width:100%;
            margin:0 0 16px;
            padding:0;
            border:0;
            border-radius:14px;
            overflow:hidden;
            background:var(--glass);
            cursor:zoom-in;
            break-inside:avoid;
            box-shadow:0 18px 40px -24px rgba(20,40,20,.55);
            transition:transform .35s var(--ease);
        }

        .tile:hover{
            transform:translateY(-4px);
        }

        .tile img{
            width:100%;
            height:auto;
        }

        .tile .credit{
            position:absolute;
            left:0;
            right:0;
            bottom:0;
            padding:28px 14px 12px;
            text-align:left;
            color:#fff;
            font-size:12px;
            letter-spacing:.12em;
            text-transform:uppercase;
            background:linear-gradient(transparent, rgba(0,0,0,.55));
            opacity:0;
            transition:opacity .3s ease;
        }

        .tile:hover .credit,
        .tile:focus-visible .credit{
            opacity:1;
        }

        /* No hover on touch screens, so credits stay visible there. */
        @media (hover:none){
            .tile .credit{ opacity:1; }
        }

        .notice{
            max-width:460px;
            margin:44px auto 0;
            padding:28px;
            text-align:center;
            border-radius:var(--radius);
            background:var(--glass);
            border:1px solid var(--glass-border);
            -webkit-backdrop-filter:blur(18px);
            backdrop-filter:blur(18px);
            color:var(--ink-soft);
            line-height:1.6;
        }

        /* ---------- LIGHTBOX ---------- */

        .lightbox{
            position:fixed;
            inset:0;
            z-index:60;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:14px;
            padding:64px 72px 28px;
            background:rgba(10,14,10,.92);
            color:#fff;
            touch-action:pan-y;
        }

        .lightbox img{
            max-width:100%;
            max-height:calc(100vh - 140px);
            max-height:calc(100dvh - 140px);
            object-fit:contain;
            border-radius:6px;
        }

        .lightbox-caption{
            font-size:12px;
            letter-spacing:.18em;
            text-transform:uppercase;
            color:rgba(255,255,255,.75);
            text-align:center;
        }

        .lightbox button{
            position:absolute;
            display:grid;
            place-items:center;
            width:44px;
            height:44px;
            border-radius:50%;
            border:1px solid rgba(255,255,255,.35);
            background:rgba(255,255,255,.08);
            font-size:18px;
            cursor:pointer;
            transition:background .2s ease;
        }

        .lightbox button:hover{
            background:rgba(255,255,255,.2);
        }

        .lightbox-close{ top:18px; right:18px; }
        .lightbox-prev{ left:14px; top:50%; margin-top:-22px; }
        .lightbox-next{ right:14px; top:50%; margin-top:-22px; }

        /* ---------- FOOTER ---------- */

        footer{
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:16px;
            flex-wrap:wrap;
            padding:40px var(--gutter);
            border-top:1px solid var(--line);
            font-size:12px;
            letter-spacing:.14em;
            text-transform:uppercase;
            color:var(--ink-soft);
        }

        footer img{
            width:72px;
            height:auto;
        }

        @media (max-width:560px){

            .gallery{
                columns:2;
                column-gap:10px;
            }

            .tile{
                margin-bottom:10px;
                border-radius:10px;
            }

            .tile .credit{
                padding:20px 10px 8px;
                font-size:10px;
            }

            .lightbox{
                padding:64px 12px 84px;
            }

            .lightbox-prev,
            .lightbox-next{
                top:auto;
                bottom:20px;
                margin-top:0;
            }

            .lightbox-prev{ left:calc(50% - 56px); }
            .lightbox-next{ right:calc(50% - 56px); }

            footer{
                justify-content:center;
                text-align:center;
            }
        }

    </style>
</head>

<body>

    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
        <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
        <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
        <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    </svg>

    <div class="bg-photo"></div>
    <div class="bg-overlay"></div>

    <header class="top">
        <a href="index.html" aria-label="Zahabu — home"><img src="images/logo-wordmark.png" alt="Zahabu"></a>
        <a class="back" href="index.html#community"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>Back to site</a>
    </header>

    <main>
        <div class="intro">
            <span class="eyebrow">From the community</span>
            <h1>Community gallery</h1>
            <p class="lead">Moments at the garden, shared by the people who were there. Every photo is looked at by our team before it appears here.</p>
            <a class="btn" href="index.html#share">Share your photos</a>
            <p class="count" id="count" hidden></p>
        </div>

        <div class="gallery" id="gallery"></div>
        <p class="notice" id="notice">Loading photos…</p>
    </main>

    <footer>
        <img src="images/logo-wordmark.png" alt="Zahabu">
        <a href="code-of-conduct.html">Code of conduct</a>
        <span>© 2026 Zahabu Culture Garden</span>
    </footer>

    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
        <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
        <button type="button" class="lightbox-prev" id="lightboxPrev" aria-label="Previous photo"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg></button>
        <img id="lightboxImg" alt="">
        <p class="lightbox-caption" id="lightboxCaption"></p>
        <button type="button" class="lightbox-next" id="lightboxNext" aria-label="Next photo"><svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></button>
    </div>

    <script>
        const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
        // Same photos Worker as index.html's Community section; `node preview.mjs` runs it on :5173 locally.
        const PHOTO_API = isLocal ? (location.port === "5173" ? "" : "http://localhost:5173") : "https://photos.zahabu.co.ke";

        const gallery = document.getElementById("gallery");
        const notice = document.getElementById("notice");
        const count = document.getElementById("count");
        const lightbox = document.getElementById("lightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxCaption = document.getElementById("lightboxCaption");
        let photos = [];
        let current = 0;
        let returnFocus = null;

        function show(index){
            current = (index + photos.length) % photos.length;
            const photo = photos[current];
            lightboxImg.src = photo.full;
            lightboxImg.alt = photo.credit ? `Photo by ${photo.credit}` : "Community photo";
            lightboxCaption.textContent = `${photo.credit ? `Photo by ${photo.credit} · ` : ""}${current + 1} / ${photos.length}`;
            // Preload the neighbours so arrowing through feels instant.
            [current - 1, current + 1].forEach(i => { new Image().src = photos[(i + photos.length) % photos.length].full; });
        }

        function open(index){
            returnFocus = document.activeElement;
            show(index);
            lightbox.hidden = false;
            document.body.classList.add("is-locked");
            document.getElementById("lightboxClose").focus();
        }

        function close(){
            lightbox.hidden = true;
            lightboxImg.removeAttribute("src");
            document.body.classList.remove("is-locked");
            returnFocus?.focus();
        }

        document.getElementById("lightboxClose").addEventListener("click", close);
        document.getElementById("lightboxPrev").addEventListener("click", () => show(current - 1));
        document.getElementById("lightboxNext").addEventListener("click", () => show(current + 1));
        lightbox.addEventListener("click", e => { if (e.target === lightbox) close(); });
        document.addEventListener("keydown", e => {
            if (lightbox.hidden) return;
            if (e.key === "Escape") close();
            if (e.key === "ArrowLeft") show(current - 1);
            if (e.key === "ArrowRight") show(current + 1);
        });

        let touchX = null;
        lightbox.addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive:true });
        lightbox.addEventListener("touchend", e => {
            if (touchX === null) return;
            const dx = e.changedTouches[0].clientX - touchX;
            if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
            touchX = null;
        });

        function render(){
            gallery.replaceChildren(...photos.map((photo, index) => {
                const tile = document.createElement("button");
                tile.type = "button";
                tile.className = "tile";
                tile.setAttribute("aria-label", photo.credit ? `Open photo by ${photo.credit}` : "Open photo");
                const img = document.createElement("img");
                img.src = photo.thumb;
                img.alt = "";
                img.loading = "lazy";
                img.width = photo.width;
                img.height = photo.height;
                tile.append(img);
                if (photo.credit) {
                    const credit = document.createElement("span");
                    credit.className = "credit";
                    credit.textContent = photo.credit;
                    tile.append(credit);
                }
                tile.addEventListener("click", () => open(index));
                return tile;
            }));
            count.textContent = `${photos.length} ${photos.length === 1 ? "photo" : "photos"}`;
            count.hidden = photos.length === 0;
            notice.textContent = "No photos yet — be the first to share a moment from the garden.";
            notice.hidden = photos.length > 0;
        }

        fetch(`${PHOTO_API}/api/photos?limit=500`)
            .then(response => { if (!response.ok) throw new Error(); return response.json(); })
            .then(result => { photos = result.photos || []; render(); })
            .catch(() => { notice.textContent = "The gallery couldn’t be loaded right now. Please try again in a little while."; });
    </script>

</body>
</html>
