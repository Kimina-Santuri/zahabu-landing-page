# Equipment inventory (inventory.zahabu.co.ke). Shares the tracker's D1 database; photos go in their own R2 bucket.
# Build with `npm run build`, deploy with `npx wrangler deploy -c wrangler.inventory.toml`.
name = "zahabu-inventory"
main = "inventory-worker.mjs"
compatibility_date = "2026-09-16"
workers_dev = false
preview_urls = false
routes = [{ pattern = "inventory.zahabu.co.ke", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "zahabu-tracker"
database_id = "c1922d96-3031-4de5-97e9-dfe2bc043286"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "zahabu-inventory"

[vars]
# From Zero Trust > Access > Applications (the "inventory" app, covering the whole inventory.zahabu.co.ke host):
# team domain and Application Audience (AUD) tag. Until both are set, every request is refused.
ACCESS_TEAM_DOMAIN = "muddy-fire-042e.cloudflareaccess.com"
ACCESS_AUD = "3350e1b4514ecdebef5369505cdbe4199db988b222796a8168640a94616d4ef6"

# Secrets (set with `npx wrangler secret put <NAME> -c wrangler.inventory.toml`, never committed):
#   EDITOR_EMAILS - comma-separated emails allowed to edit, e.g. "a@zahabu.co.ke,b@gmail.com"; "@zahabu.co.ke" allows
#                   a whole domain. Everyone else that Access lets in gets view-only. Kept secret because this repo is public.
