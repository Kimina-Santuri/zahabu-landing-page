# Community photo submissions (photos.zahabu.co.ke). Separate from the tech tracker Worker in wrangler.toml
# but shares its D1 database. Build with `npm run build`, deploy with `npx wrangler deploy -c wrangler.photos.toml`.
name = "zahabu-photos"
main = "dist/photos/index.js"
compatibility_date = "2026-09-16"
workers_dev = false
preview_urls = false
# zahabu.co.ke itself is GitHub Pages behind Cloudflare's proxy; only /stories* is sent to this Worker (stories.mjs).
routes = [
  { pattern = "photos.zahabu.co.ke", custom_domain = true },
  { pattern = "comms.zahabu.co.ke", custom_domain = true },   # Stories editor; covered by the same Access app as photos.zahabu.co.ke/admin
  { pattern = "zahabu.co.ke/stories*", zone_name = "zahabu.co.ke" },
  { pattern = "www.zahabu.co.ke/stories*", zone_name = "zahabu.co.ke" },
]

[[d1_databases]]
binding = "DB"
database_name = "zahabu-tracker"
database_id = "c1922d96-3031-4de5-97e9-dfe2bc043286"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "zahabu-community-photos"

# Mixes uploaded from the Stories editor (stories.mjs). Its own bucket so the editor can show how much of R2's free 10 GB mixes use.
[[r2_buckets]]
binding = "MIXES"
bucket_name = "zahabu-mixes"

# Contact form email. Sends only to info@zahabu.co.ke, which must be a verified Email Routing destination address.
# The sender (CONTACT_FROM) must be on a domain with Email Routing on: the mail.zahabu.co.ke subdomain, so Zoho keeps zahabu.co.ke's own mail.
[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "info@zahabu.co.ke"

[vars]
CONTACT_FROM = "website@mail.zahabu.co.ke"
ALLOWED_ORIGINS = "https://zahabu.co.ke,https://www.zahabu.co.ke"
# From Zero Trust > Access > Applications (the "photos admin" app): team domain and Application Audience (AUD) tag.
# Until both are set, /admin refuses every request.
ACCESS_TEAM_DOMAIN = "muddy-fire-042e.cloudflareaccess.com"
ACCESS_AUD = "b36b4da28e0fd44c1a706aaca98911a163a6d522873ac592443b1e5901108db2"

# Stories (stories.mjs). The subscribe box and newsletter stay hidden until BREVO_API_KEY, NEWSLETTER_FROM and BREVO_LIST_ID are all set.
SITE_ORIGIN = "https://zahabu.co.ke"
TURNSTILE_SITE_KEY = "0x4AAAAAAFHmoNtXVh4PIyD2"
NEWSLETTER_FROM_NAME = "Zahabu"
NEWSLETTER_REPLY_TO = "comms@zahabu.co.ke"
NEWSLETTER_FROM = "stories@zahabu.co.ke"   # sender "Zahabu", verified in Brevo (domain zahabu.co.ke authenticated and branded there)
BREVO_LIST_ID = "3"                         # the "Zahabu Stories" list in Brevo → Contacts → Lists

# Secrets (set with `npx wrangler secret put <NAME> -c wrangler.photos.toml`, never committed):
#   TURNSTILE_SECRET - secret key of the Turnstile widget for zahabu.co.ke
#   IP_SALT          - any long random string; salts the hashed IPs used for rate limiting
#   BREVO_API_KEY    - Brevo → SMTP & API → API keys (set it in the dashboard, not with `!` inside Claude Code)
